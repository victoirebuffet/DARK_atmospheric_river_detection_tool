# CESM2-LE direct-IVT example. One pattern discovers all chunks for a member.
dataset: CESM2-LE
output_dir: /work/crct/USER/DARK/cesm2/LE2-1011.001/HIST
years: [1990, 2009]
data:
  ivt_type: scalar
  member: LE2-1011.001
  # `file_glob` is expanded automatically; no manual list of decade files.
  file_glob: /data/b.e21.BHISTsmbb.f09_g17.{member}.cam.h2.IVT.*.nc
  ivt_variable: IVT
  longitude_domain: native
  periodic_longitude: auto
  # Optional only when coordinate/dimension names are non-standard:
  # coordinates: {time: time, lat: lat, lon: lon}
  # dimensions: {time: time, lat: lat, lon: lon}
  region:
    latitude: [-90, -15]
    longitude: [0, 360]
percentile:
  quantile: 0.98
  window_days: 15
dark:
  min_area_km2: 200000
  min_length_km: 2000
children:
  enabled: false
  # If enabled, these are required for every model:
  # land_mask_file: /data/land_mask.nc
  # land_mask_variable: lsm
