# MERRA-2 / any direct scalar-IVT annual file.
dataset: MERRA2
output_dir: /work/crct/USER/DARK/merra2_q98
years: [1980, 2023]
data:
  ivt_type: scalar
  file_pattern: /data/ARTMIP_MERRA_2D_{year}_3h.nc
  ivt_variable: IVT
  longitude_domain: native
  periodic_longitude: auto
  # Optional only when coordinate/dimension names are non-standard:
  # coordinates: {time: time, lat: lat, lon: lon}
  # dimensions: {time: time, lat: lat, lon: lon}
  region:
    latitude: [-90, -15]
    longitude: [0, 360]
percentile:
  quantile: 0.98
  window_days: 15
dark:
  min_area_km2: 200000
  min_length_km: 2000
  compatibility_profile: merra2_legacy  # Remove for a new, generic run.
children:
  enabled: false
  # If enabled, these are required for every model:
  # land_mask_file: /data/land_mask.nc
  # land_mask_variable: lsm
